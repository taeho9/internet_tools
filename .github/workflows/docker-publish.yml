name: Build and Push Multi-Arch Docker Images to GHCR

on:
  push:
    branches:
      - main
      - taeho_dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM / multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Nginx image (ARM64 & AMD64)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tools-nginx:latest
            ghcr.io/${{ env.OWNER_LC }}/tools-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PHP-FPM image (ARM64 & AMD64)
        uses: docker/build-push-action@v5
        with:
          context: ./php-fpm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tools-php-fpm:latest
            ghcr.io/${{ env.OWNER_LC }}/tools-php-fpm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
